[project]
name = "deepgram-dictate"
version = "0.1.0"
description = "Push-to-talk dictation with the Deepgram pre-recorded API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "deepgram-sdk>=7.14.0",
    "numpy>=2.5.4",
    "pynput>=1.8.2",
    "sounddevice>=0.5.6",
]

[project.scripts]
deepgram-dictate = "deepgram_dictate:main"

[dependency-groups]
dev = []

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"
